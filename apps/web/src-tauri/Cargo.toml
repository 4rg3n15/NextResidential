[package]
name = "ncr-consola"
version = "0.1.0"
description = "Consola de Next Control Residencial empaquetada para escritorio (ADR-002)"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Menos superficie y binario más pequeño, que es la mitad del argumento de
# ADR-002 frente a Electron.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

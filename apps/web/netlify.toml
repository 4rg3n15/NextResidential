# =============================================================================
# La consola en Netlify · D-160 (PR 2 de 3, ADR-041)
#
# La base es la RAÍZ del monorepo: ahí están el lockfile, `.nvmrc` y los
# paquetes `@ncr/config` y `@ncr/contracts`, que Next transpila
# (`transpilePackages`). Rutas absolutas desde esa base (documentación de
# Netlify, «file-based configuration»).
#
# El Next.js lo despliega el adaptador OpenNext de Netlify, que se instala solo
# y no se fija aquí: la documentación de Netlify recomienda no fijarlo.
#
# Las variables NO van aquí: `netlify.toml` sólo se lee al construir, y las
# funciones y el middleware las leen al ejecutar. Se cargan en el panel de
# Netlify (DESPLIEGUE_NETLIFY.md §4), nunca en el repositorio.
# =============================================================================
[build]
  command = "pnpm --filter @ncr/web build"
  publish = "apps/web/.next"

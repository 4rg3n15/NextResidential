# Verificación · TRES trabajos, y cada uno responde a una pregunta distinta.
#
#   · `controles`            ¿siguen detectando los controles lo que dicen
#                            detectar? Corre en Linux (GNU) y macOS (BSD) a
#                            propósito: tres veces una diferencia entre ambos
#                            cambió el resultado de una verificación.
#   · `verificador-con-base` ¿pasa el verificador ENTERO, con PostgreSQL
#                            delante, fuera de la máquina del usuario?
#   · `entregables`          ¿produce este repositorio los SEIS entregables?
#
# Este flujo nació en la ETAPA 13 con el primero solo, adelantado porque cubría
# algo que no podía esperar. La ETAPA 14 añade el tercero y con él la DoD que
# faltaba: hasta ahora el CI compilaba con `pnpm build` —API, consola y Edge— y
# no tocaba ni Flutter ni el escritorio, es decir, dos de los seis entregables
# no los había construido nunca ninguna máquina salvo la del usuario.
name: verificacion

on:
  push:
    # `correccion-**` entra aquí porque la primera rama de corrección se empujó
    # y NO disparó nada: el patrón solo cubría `etapa-**`. Una rama que arregla
    # el CI y a la que el CI no mira es la misma familia de defecto que esta
    # rama viene a cerrar, en su forma más literal.
    branches: [develop, main, 'etapa-**', 'correccion-**']
  pull_request:
    branches: [develop, main]

jobs:
  controles:
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia COMPLETA: el escaneo del historial (H-13-17) no puede
          # mirar lo que el checkout no trajo, y el valor por omisión es 1.
          # Un control que corre sobre un solo commit informaría «limpio»
          # sobre un repositorio que no ha visto.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Entorno dentro de lo declarado
        run: node scripts/lib/verificar-entorno.mjs

      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile

      - name: Portabilidad BSD/GNU de todas las superficies con shell
        run: node scripts/lib/portabilidad.mjs

      - name: Escaneo de secretos
        run: node scripts/lib/escanear-secretos.mjs

      # El alcance de la ETAPA 13 pide «ninguno está en el código NI EN EL
      # HISTORIAL de Git». Hasta entonces la segunda mitad no tenía control:
      # un secreto confirmado y retirado en el commit siguiente dejaba el
      # escáner en «limpio» mientras la llave seguía siendo recuperable.
      - name: Escaneo de secretos en el historial
        run: node scripts/lib/escanear-secretos.mjs --historial

      - name: Pruebas negativas de los controles
        run: node scripts/lib/pruebas-negativas.mjs

      - name: Compilación, lint y tipos
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck

      - name: Suite completa y umbrales de cobertura
        run: node scripts/lib/metricas.mjs

      # ═══════════════════════════════════════════════════════════════════════
      # INSTRUMENTO PARA D-101 · la intermitente de `@ncr/api` en Linux bajo
      # cobertura, vista UNA vez en cuarenta y cinco corridas deliberadas.
      #
      # D-100 arregló que la prueba roja se NOMBRARA. El nombre solo no basta
      # para diagnosticar: hace falta el registro completo —cada aserción con
      # su estado, su duración y el orden— y eso vive en el informe JSON, que
      # hasta ahora se escribía en un temporal y se tiraba.
      #
      # `if: failure()` y no siempre: en verde no hay nada que diagnosticar, y
      # subir seis informes por corrida sería ruido. Una aparición cada
      # cuarenta y cinco corridas no se reproduce a voluntad; hay que estar
      # preparado para la que venga.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Informes de prueba (solo si algo falló · D-101)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-prueba-${{ matrix.so }}
          if-no-files-found: ignore
          retention-days: 14
          path: .informes-de-prueba/*.json

      - name: Fronteras de arquitectura (DoD ETAPA 02)
        run: ./scripts/verificar-frontera.sh

      - name: KPI-11 · el protocolo del fabricante no sale de packages/providers
        run: node scripts/lib/frontera-hardware.mjs

      # Añadidos el 2026-09-09 tras la revisión que pidió el usuario. Estos
      # cuatro controles EXISTÍAN y se probaban en «Pruebas negativas» —donde se
      # comprueba que detectan su violación—, pero no se ejecutaban nunca contra
      # el repositorio. Es la misma familia de defecto por otra vía: el control
      # está escrito, está probado, y no mira nada.
      - name: A un módulo se entra por su barril (§2.2)
        run: node scripts/lib/frontera-modulos.mjs

      - name: Ninguna clave ajena vigente hacia una tabla append-only (ADR-005)
        run: node scripts/lib/frontera-append-only.mjs

      - name: El contrato OpenAPI declara el tipo de toda respuesta
        run: node scripts/lib/contrato-tipado.mjs

      - name: El contrato y el cliente generado están al día
        run: node scripts/lib/contrato-desfasado.mjs

      # ═══════════════════════════════════════════════════════════════════════
      # ETAPA 14 · los tres controles nuevos
      # ═══════════════════════════════════════════════════════════════════════
      - name: Todo bloque ```mermaid del repositorio ANALIZA
        run: node scripts/lib/mermaid-analizable.mjs

      - name: La consola es instalable como PWA
        run: node scripts/lib/pwa-instalable.mjs

      # La paleta se genera desde el preset COMPILADO, así que `pnpm build`
      # tiene que haber corrido antes. Va después del bloque de compilación por
      # eso, no por orden estético.
      - name: La paleta de la app Flutter coincide con el preset (D-78)
        run: node scripts/lib/generar-paleta-dart.mjs --comprobar

      # ═══════════════════════════════════════════════════════════════════════
      # DEPENDENCIAS VULNERABLES · el alcance de la ETAPA 14 lo pide y hasta
      # ahora no había paso: la ETAPA 13 auditó a mano y dejó el árbol en 0
      # altas y 0 críticas, pero nada impedía que la siguiente instalación las
      # devolviera.
      #
      # El umbral es `high`, y eso es una decisión, no una omisión: el árbol
      # arrastra hoy 12 avisos entre `low` y `moderate` que vienen de Express 4
      # y Nest 10 —`qs`, `body-parser`, `file-type`— y no tienen versión
      # corregida sin subir de mayor. Fallar por ellos convertiría el paso en
      # ruido que se ignora, que es cómo un control deja de servir. Se imprimen
      # SIEMPRE para que se vean, y rompen el build a partir de `high`.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Dependencias vulnerables (informe completo)
        run: pnpm audit --prod || true

      - name: Dependencias vulnerables (rompe a partir de `high`)
        run: pnpm audit --prod --audit-level=high

  # ═══════════════════════════════════════════════════════════════════════════
  # EL VERIFICADOR ENTERO, CON BASE, EN macOS.
  #
  # Hasta esta corrección el CI NO ejecutaba `verificar-etapa.sh` en absoluto.
  # Corría los nueve controles de arriba, que son valiosos y no son el
  # verificador: este tiene VEINTICINCO pasos. La consecuencia, escrita sin
  # rodeos, es que los pasos 12, 12b, 12c y 13 —esquema, aislamiento, arranque
  # en frío, KPI-03 e inmutabilidad contra PostgreSQL real— no se habían
  # ejecutado NUNCA en ninguna máquina salvo la del usuario, y que el veredicto
  # «25 de 25 pasos» de todos los informes anteriores salía siempre de una sola
  # máquina.
  #
  # Se vio al primer intento: el paso 12 comparaba la salida de `wc` como texto
  # y en BSD viene almohadillada, así que fallaba en macOS **con el KPI-03
  # cumplido delante**. Un defecto de meses que ningún control podía ver porque
  # en el único sitio donde el paso corría no había CI.
  #
  # Corre en macOS porque es el entorno de desarrollo declarado en §2.8.0 y el
  # que tiene BSD. Es un trabajo aparte del de arriba, no un paso más, por tres
  # razones: tarda mucho más, necesita SDK de Flutter y PostgreSQL, y su fallo
  # debe poder leerse sin confundirse con el de los controles rápidos.
  # ═══════════════════════════════════════════════════════════════════════════
  verificador-con-base:
    name: verificar-etapa.sh --con-base (macos)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia COMPLETA, igual que en `controles`, y por el mismo motivo.
          # Se descubrió comparando dos salidas del MISMO control en la misma
          # corrida: el paso 10 de este trabajo informaba
          #   «limpio (1136 blobs del historial alcanzable)»
          # mientras que en local y en `controles` eran 2182. No es una
          # diferencia de máquina: es que este checkout no traía la historia, y
          # el escaneo del historial daba «limpio» sobre un repositorio que no
          # había visto. Es LITERALMENTE el modo de fallo que H-13-17 documenta,
          # reintroducido por la mitad del remedio.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      # El orden importa: el control de la base carga `pg` del árbol instalado,
      # así que la instalación va ANTES. Al revés, el paso fallaría por no
      # encontrar el módulo y el mensaje hablaría de otra cosa.
      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile

      # El paso 12c conduce Chromium y NO está declarado: sin navegador falla, y
      # con razón —«la ausencia es un fallo inmediato y explícito»—. Se instala
      # aquí para que el fallo, si llega, sea del camino y no del entorno.
      - name: Chromium para el paso 12c
        run: pnpm exec playwright install chromium

      - name: PostgreSQL en el runner
        run: |
          brew install postgresql@16 || brew list postgresql@16
          ./scripts/base-de-pruebas.sh arrancar | sed 's/^export //' >>"$GITHUB_ENV"

      # PRUEBA NEGATIVA DEL CONTROL DE LA BASE, y sale gratis: en este punto el
      # clúster está recién creado y VACÍO, que es exactamente la condición que
      # el control tiene que rechazar. Hasta esta ronda la daba por buena —dijo
      # «conectado como postgres» y cuatro minutos después aparecían cinco rojas
      # de `residente-pg.test.ts` sin relación aparente con la base—. Un control
      # que nadie ha visto fallar no está demostrado (§2.8.0), y este no tenía
      # dónde demostrarse porque el banco de pruebas negativas no tiene
      # PostgreSQL. Aquí sí lo hay, y en el único instante en que sirve.
      - name: Una base SIN esquema se detecta como tal
        run: |
          if node scripts/lib/verificar-base-de-pruebas.mjs; then
            echo "FALLO el control dio por buena una base sin esquema" >&2
            exit 1
          fi
          echo "ok · una base que contesta pero no tiene esquema NO pasa por buena"

      # Y ahora se deja en el estado del que parten los pasos 5, 7, 12b y 13:
      # migrada y sembrada. En la máquina del usuario ese estado lleva puesto
      # desde hace semanas y nadie lo declara; aquí se declara.
      # `--con-pruebas` y no `--con-semillas`: además de migrar y sembrar,
      # ejecuta la SUITE DE POLÍTICAS RLS con sus pruebas negativas. Era un
      # requisito registrado para esta etapa —«la suite
      # `./supabase/verificar.sh --con-pruebas --modo-supabase` y la prueba de
      # concurrencia KPI-03 deben ejecutarse EN CI, no en el entorno del
      # usuario»— y hasta ahora el CI se quedaba en las semillas. KPI-03 lo
      # ejerce el paso 13 de `verificar-etapa.sh --con-base`, más abajo.
      - name: Migraciones, semillas y suite de políticas RLS
        run: ./supabase/verificar.sh --con-pruebas --modo-supabase

      - name: La base contesta, con esquema y semillas
        run: node scripts/lib/verificar-base-de-pruebas.mjs

      - name: El verificador completo, con base
        run: ./scripts/verificar-etapa.sh --con-base

  # ═══════════════════════════════════════════════════════════════════════════
  # LOS SEIS ENTREGABLES, DESDE UN SOLO REPOSITORIO · DoD de la ETAPA 14
  #
  # «Un solo repositorio produce API, consola web, PWA instalable, aplicación de
  # escritorio, app Flutter y Edge Gateway, todo desde CI.» Hasta esta etapa el
  # CI compilaba con `pnpm build` —que cubre la API, la consola y el Edge— y no
  # tocaba ni Flutter ni el escritorio. Es decir, dos de los seis entregables no
  # los había construido nunca ninguna máquina salvo la del usuario.
  #
  # Va en un trabajo aparte de `controles` por lo mismo que el verificador con
  # base: necesita SDK de Flutter y cadena de Rust, tarda mucho más, y su fallo
  # tiene que poder leerse sin confundirse con el de los controles rápidos.
  # ═══════════════════════════════════════════════════════════════════════════
  entregables:
    name: los seis entregables (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      # Sin estas, `cargo` falla con «gdk-3.0 no encontrado» y el mensaje habla
      # de pkg-config, no de Tauri. Son las del empaquetado de escritorio en
      # Linux; en macOS y Windows las trae el sistema.
      - name: Bibliotecas de sistema para el empaquetado de escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile

      # 1, 2 y 6 · API, consola web y Edge Gateway.
      - name: API, consola y Edge
        run: pnpm build

      # 3 · La PWA. El `build` de Next no comprueba la instalabilidad: el
      # manifiesto y el service worker son ficheros estáticos y compilan igual
      # estén bien o mal.
      - name: PWA instalable
        run: node scripts/lib/pwa-instalable.mjs

      # 4 · El escritorio. `deb` y no el conjunto completo: AppImage descarga
      # su runtime en cada corrida y es la parte frágil del empaquetado. Un
      # paquete real basta para demostrar que el repositorio produce escritorio.
      - name: Escritorio (Tauri · ADR-002)
        run: pnpm --filter @ncr/web exec tauri build --bundles deb

      - name: Y sus pruebas de política de red
        run: cargo test --manifest-path apps/web/src-tauri/Cargo.toml

      # 5 · La app del residente. `web` y no `apk`: el APK exige SDK de Android
      # y firma, y lo que este trabajo demuestra es que el código compila desde
      # el repositorio. El recorrido en navegador lo ejerce el verificador.
      - name: App Flutter del residente
        run: |
          cd apps/mobile
          flutter build web --release

      - name: Qué produjo esta corrida
        run: |
          echo "── API ──"        && ls -la apps/api/dist/main.js
          echo "── consola ──"    && ls -la apps/web/.next/BUILD_ID
          echo "── edge ──"       && ls -la apps/edge/dist
          echo "── escritorio ──" && ls -la apps/web/src-tauri/target/release/bundle/deb/
          echo "── flutter ──"    && ls -la apps/mobile/build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: entregables
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/src-tauri/target/release/bundle/deb/*.deb
            apps/mobile/build/web/index.html
            apps/web/public/manifest.webmanifest

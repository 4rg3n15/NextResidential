# Verificación de los CONTROLES, no del producto.
#
# El flujo completo de CI —build de las cuatro aplicaciones, PWA, escritorio,
# despliegue— es la ETAPA 14. Este flujo se adelanta porque cubre algo que no
# puede esperar: los controles que detectan falsos verdes solo protegen si
# alguien comprueba que siguen detectando, y hasta ahora eso se hacía a mano.
#
# Corre en Linux (GNU) y macOS (BSD) a propósito: tres veces una diferencia
# entre ambos cambió el resultado de una verificación.
name: verificacion

on:
  push:
    # `correccion-**` entra aquí porque la primera rama de corrección se empujó
    # y NO disparó nada: el patrón solo cubría `etapa-**`. Una rama que arregla
    # el CI y a la que el CI no mira es la misma familia de defecto que esta
    # rama viene a cerrar, en su forma más literal.
    branches: [develop, main, 'etapa-**', 'correccion-**']
  pull_request:
    branches: [develop, main]

jobs:
  controles:
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Entorno dentro de lo declarado
        run: node scripts/lib/verificar-entorno.mjs

      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile

      - name: Portabilidad BSD/GNU de todas las superficies con shell
        run: node scripts/lib/portabilidad.mjs

      - name: Escaneo de secretos
        run: node scripts/lib/escanear-secretos.mjs

      - name: Pruebas negativas de los controles
        run: node scripts/lib/pruebas-negativas.mjs

      - name: Compilación, lint y tipos
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck

      - name: Suite completa y umbrales de cobertura
        run: node scripts/lib/metricas.mjs

      - name: Fronteras de arquitectura (DoD ETAPA 02)
        run: ./scripts/verificar-frontera.sh

      - name: KPI-11 · el protocolo del fabricante no sale de packages/providers
        run: node scripts/lib/frontera-hardware.mjs

      # Añadidos el 2026-09-09 tras la revisión que pidió el usuario. Estos
      # cuatro controles EXISTÍAN y se probaban en «Pruebas negativas» —donde se
      # comprueba que detectan su violación—, pero no se ejecutaban nunca contra
      # el repositorio. Es la misma familia de defecto por otra vía: el control
      # está escrito, está probado, y no mira nada.
      - name: A un módulo se entra por su barril (§2.2)
        run: node scripts/lib/frontera-modulos.mjs

      - name: Ninguna clave ajena vigente hacia una tabla append-only (ADR-005)
        run: node scripts/lib/frontera-append-only.mjs

      - name: El contrato OpenAPI declara el tipo de toda respuesta
        run: node scripts/lib/contrato-tipado.mjs

      - name: El contrato y el cliente generado están al día
        run: node scripts/lib/contrato-desfasado.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # EL VERIFICADOR ENTERO, CON BASE, EN macOS.
  #
  # Hasta esta corrección el CI NO ejecutaba `verificar-etapa.sh` en absoluto.
  # Corría los nueve controles de arriba, que son valiosos y no son el
  # verificador: este tiene VEINTICINCO pasos. La consecuencia, escrita sin
  # rodeos, es que los pasos 12, 12b, 12c y 13 —esquema, aislamiento, arranque
  # en frío, KPI-03 e inmutabilidad contra PostgreSQL real— no se habían
  # ejecutado NUNCA en ninguna máquina salvo la del usuario, y que el veredicto
  # «25 de 25 pasos» de todos los informes anteriores salía siempre de una sola
  # máquina.
  #
  # Se vio al primer intento: el paso 12 comparaba la salida de `wc` como texto
  # y en BSD viene almohadillada, así que fallaba en macOS **con el KPI-03
  # cumplido delante**. Un defecto de meses que ningún control podía ver porque
  # en el único sitio donde el paso corría no había CI.
  #
  # Corre en macOS porque es el entorno de desarrollo declarado en §2.8.0 y el
  # que tiene BSD. Es un trabajo aparte del de arriba, no un paso más, por tres
  # razones: tarda mucho más, necesita SDK de Flutter y PostgreSQL, y su fallo
  # debe poder leerse sin confundirse con el de los controles rápidos.
  # ═══════════════════════════════════════════════════════════════════════════
  verificador-con-base:
    name: verificar-etapa.sh --con-base (macos)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      # El orden importa: el control de la base carga `pg` del árbol instalado,
      # así que la instalación va ANTES. Al revés, el paso fallaría por no
      # encontrar el módulo y el mensaje hablaría de otra cosa.
      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile

      # El paso 12c conduce Chromium y NO está declarado: sin navegador falla, y
      # con razón —«la ausencia es un fallo inmediato y explícito»—. Se instala
      # aquí para que el fallo, si llega, sea del camino y no del entorno.
      - name: Chromium para el paso 12c
        run: pnpm exec playwright install chromium

      - name: PostgreSQL en el runner
        run: |
          brew install postgresql@16 || brew list postgresql@16
          ./scripts/base-de-pruebas.sh arrancar | sed 's/^export //' >>"$GITHUB_ENV"

      - name: La base contesta antes de gastar cuarenta minutos
        run: node scripts/lib/verificar-base-de-pruebas.mjs

      - name: El verificador completo, con base
        run: ./scripts/verificar-etapa.sh --con-base

# Verificación de los CONTROLES, no del producto.
#
# El flujo completo de CI —build de las cuatro aplicaciones, PWA, escritorio,
# despliegue— es la ETAPA 14. Este flujo se adelanta porque cubre algo que no
# puede esperar: los controles que detectan falsos verdes solo protegen si
# alguien comprueba que siguen detectando, y hasta ahora eso se hacía a mano.
#
# Corre en Linux (GNU) y macOS (BSD) a propósito: tres veces una diferencia
# entre ambos cambió el resultado de una verificación.
name: verificacion

on:
  push:
    branches: [develop, main, 'etapa-**']
  pull_request:
    branches: [develop, main]

jobs:
  controles:
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Entorno dentro de lo declarado
        run: node scripts/lib/verificar-entorno.mjs

      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile

      - name: Portabilidad BSD/GNU de todas las superficies con shell
        run: node scripts/lib/portabilidad.mjs

      - name: Escaneo de secretos
        run: node scripts/lib/escanear-secretos.mjs

      - name: Pruebas negativas de los controles
        run: node scripts/lib/pruebas-negativas.mjs

      - name: Compilación, lint y tipos
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck

      # ══════════════════════════════════════════════════════════════════════
      # PASO TEMPORAL · caza de la roja intermitente de @ncr/api en Linux
      #
      # La ETAPA 12 se declaró cerrada sobre un veredicto local de macOS; en
      # `ubuntu-latest` la MISMA SHA salió roja con UNA prueba de 658. Es
      # intermitente —en Linux de 4 vCPU la suite pasa 3 de 3, dos de ellas con
      # `taskset -c 0,1`— así que esperar a que vuelva a salir no es un método:
      # «flake» no es una causa raíz, y re-ejecutar hasta que salga verde es
      # declarar cerrado lo que no se entendió.
      #
      # Se repite la suite bajo cobertura hasta cinco veces y se para en la
      # PRIMERA roja, con el nombre ya impreso por `metricas.mjs` (D-100).
      #
      # SE RETIRA en cuanto el nombre esté. Un paso que multiplica por cinco el
      # tiempo del trabajo no se queda «por si acaso».
      # ══════════════════════════════════════════════════════════════════════
      - name: '[TEMPORAL] Caza de la roja intermitente de @ncr/api'
        if: matrix.so == 'ubuntu-latest'
        env:
          NCR_PAQUETES_METRICAS: '@ncr/api'
        # Una corrida restringida SALE 1 por diseño —no puede medir las capas
        # que no corrió—, así que el código de salida no es la señal aquí: la
        # señal es la cadena que `metricas.mjs` imprime.
        run: |
          for i in 1 2 3 4 5; do
            echo "── intento $i de 5 ──────────────────────────────────────────"
            node scripts/lib/metricas.mjs > "/tmp/intento-$i.log" 2>&1 || true
            if grep -q 'SUITE EN ROJO' "/tmp/intento-$i.log"; then
              echo "════ ROJA CAZADA EN EL INTENTO $i ════"
              grep -A 12 'SUITE EN ROJO' "/tmp/intento-$i.log"
              exit 1
            fi
            if grep -q 'CORRIDA INTERRUMPIDA' "/tmp/intento-$i.log"; then
              echo "intento $i: el proceso NO terminó (no hay prueba a la que culpar)"
              grep -A 6 'CORRIDA INTERRUMPIDA' "/tmp/intento-$i.log"
            else
              echo "intento $i: sin rojas"
            fi
          done
          echo "cinco intentos sin reproducir la roja"

      - name: Suite completa y umbrales de cobertura
        run: node scripts/lib/metricas.mjs

      - name: Fronteras de arquitectura (DoD ETAPA 02)
        run: ./scripts/verificar-frontera.sh

      - name: KPI-11 · el protocolo del fabricante no sale de packages/providers
        run: node scripts/lib/frontera-hardware.mjs

      # Añadidos el 2026-09-09 tras la revisión que pidió el usuario. Estos
      # cuatro controles EXISTÍAN y se probaban en «Pruebas negativas» —donde se
      # comprueba que detectan su violación—, pero no se ejecutaban nunca contra
      # el repositorio. Es la misma familia de defecto por otra vía: el control
      # está escrito, está probado, y no mira nada.
      - name: A un módulo se entra por su barril (§2.2)
        run: node scripts/lib/frontera-modulos.mjs

      - name: Ninguna clave ajena vigente hacia una tabla append-only (ADR-005)
        run: node scripts/lib/frontera-append-only.mjs

      - name: El contrato OpenAPI declara el tipo de toda respuesta
        run: node scripts/lib/contrato-tipado.mjs

      - name: El contrato y el cliente generado están al día
        run: node scripts/lib/contrato-desfasado.mjs
